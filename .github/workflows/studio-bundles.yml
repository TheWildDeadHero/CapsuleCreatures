# The prebuilt studio bundles of a release (D-40 package RI).
#
# release.yml calls this workflow once per release, after the version check. Each platform's job builds the
# one-folder bundle with the toolkit's own build script (toolkit/packaging/build_bundle.py: PyInstaller, Qt kept as
# replaceable shared libraries), unpacks the download into a new folder and smoke-tests it there on Qt's offscreen
# platform (start, make a new game from the engine's Starter sample, open it in the Studio, show every page, quit;
# both executables), then uploads it. toolkit/packaging/README.md has the layout and the choices.
#
# Linux (D-40 RX): the bundle is built in a manylinux container (LINUX_IMAGE, AlmaLinux inside) with a Python built
# there from CPython's pinned release commit (shared libpython, as PyInstaller needs), so the bundled Python and its
# libraries need no newer glibc than the container's. A check then fails the job when any ELF file of the download
# needs a glibc symbol newer than LINUX_GLIBC_MAX, or a libstdc++ / libgcc_s symbol version the container's own copy
# (the oldest the download supports) does not define (.github/scripts/check_elf_baseline.py). The baseline is set
# by the pinned PySide6 wheels: PySide6 6.11.2's Qt libraries need glibc 2.34 and GLIBCXX_3.4.29 (GCC 11), so the
# container is manylinux_2_34 (the samples, with no Qt, use manylinux_2_28). With PySide6 wheels built for
# manylinux_2_28, bundle-linux's container line, LINUX_IMAGE and LINUX_GLIBC_MAX are the lines to change.
#
# Contract (release.yml)
#   inputs   version       the release version, already checked (D-10 YYYY.MM.DD.MMMM)
#            umbrella_sha  the umbrella commit being released; checked out with submodules: recursive, so
#                          toolkit/ and engine/ are the pinned commits
#   outputs  ready         "true" when all three artifacts below were uploaded, else "false" (release.yml then
#                          leaves the bundles out of the draft release)
#   artifacts, one per platform, each holding exactly the file to attach to the release:
#            studio-linux-x86_64      capsule-studio-<version>-linux-x86_64.tar.gz
#            studio-windows-x64       capsule-studio-<version>-windows-x64.zip
#            studio-macos-universal2  capsule-studio-<version>-macos-universal2.zip (CapsuleStudio.app, unsigned)
#
# A platform that fails does not stop the release: its job is continue-on-error, `ready` turns "false" with a
# warning, and the draft release carries the sample builds only (re-run the failed job, then the publish job).
# Actions are pinned to full commit SHAs; the comment names the release tag.
name: studio-bundles

on:
   workflow_call:
      inputs:
         version:
            description: "Release version (D-10), already validated"
            required: true
            type: string
         umbrella_sha:
            description: "Umbrella commit being released"
            required: true
            type: string
      outputs:
         ready:
            description: '"true" when every studio-<platform> artifact was uploaded'
            value: ${{ jobs.ready.outputs.ready }}

permissions:
   contents: read

env:
   # The Python every bundle embeds (one version for all three platforms; PySide6 6.11 and PyInstaller 6.22
   # support it). macOS takes python.org's universal2 installer (arm64 + x86_64 in one), which setup-python does
   # not provide; it is checked against the Python Software Foundation's Apple Developer ID before it is installed.
   PYTHON_VERSION: "3.14.8"
   MAC_PYTHON_PKG: https://www.python.org/ftp/python/3.14.8/python-3.14.8-macos11.pkg
   MAC_PYTHON_SIGNER: "Developer ID Installer: Python Software Foundation (BMM5U3QVKW)"
   MAC_PYTHON: /Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14
   QT_QPA_PLATFORM: offscreen
   PYTHONDONTWRITEBYTECODE: "1"
   # Linux: the build container, its glibc (the newest glibc symbol version the download may need), the CPython
   # release commit the bundled Python is built from (the tag must point at it), and where it is installed.
   LINUX_IMAGE: quay.io/pypa/manylinux_2_34_x86_64:latest
   LINUX_GLIBC_MAX: "2.34"
   CPYTHON_REPO: https://github.com/python/cpython.git
   CPYTHON_TAG: v3.14.8
   CPYTHON_COMMIT: 8e6e75d9102e39bed2a2b279203a396741180f12
   LINUX_PYTHON_PREFIX: /opt/capsule-python

jobs:
   bundle:
      name: studio bundle (${{ matrix.platform }})
      continue-on-error: true
      timeout-minutes: 60
      strategy:
         fail-fast: false
         matrix:
            include:
               - platform: windows-x64
                 os: windows-2025
                 archive: zip
               - platform: macos-universal2
                 os: macos-15
                 archive: zip
      runs-on: ${{ matrix.os }}
      defaults:
         run:
            shell: bash
      env:
         VERSION: ${{ inputs.version }}
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
           with:
              ref: ${{ inputs.umbrella_sha }}
              submodules: recursive
         - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97   # v7.0.0
           if: runner.os == 'Windows'
           with:
              python-version: ${{ env.PYTHON_VERSION }}
         - name: Python (macOS, universal2 from python.org)
           if: runner.os == 'macOS'
           run: |
              pkg="$RUNNER_TEMP/python.pkg"
              curl -fsSL -o "$pkg" "$MAC_PYTHON_PKG"
              pkgutil --check-signature "$pkg" | tee "$RUNNER_TEMP/signature.txt"
              grep -F "$MAC_PYTHON_SIGNER" "$RUNNER_TEMP/signature.txt"
              sudo installer -pkg "$pkg" -target /
              archs=$(lipo -archs "$MAC_PYTHON")
              echo "python: $archs"
              case " $archs " in *" arm64 "*) ;; *) echo "missing arm64"; exit 1 ;; esac
              case " $archs " in *" x86_64 "*) ;; *) echo "missing x86_64"; exit 1 ;; esac
         - name: Build environment (pinned PySide6 and PyInstaller)
           run: |
              if [ "$RUNNER_OS" = macOS ]; then base="$MAC_PYTHON"; else base=python; fi
              "$base" -m venv "$RUNNER_TEMP/venv"
              if [ "$RUNNER_OS" = Windows ]; then
                 py="$RUNNER_TEMP/venv/Scripts/python.exe"
              else
                 py="$RUNNER_TEMP/venv/bin/python"
              fi
              echo "PY=$py" >> "$GITHUB_ENV"
              "$py" --version
              "$py" -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
                 -r toolkit/toolkit/requirements/ui.txt
              "$py" -m pip install --disable-pip-version-check --no-input --prefer-binary \
                 -r toolkit/packaging/requirements-bundle.txt
              "$py" -m pip list
         - name: Build the bundle
           id: build
           run: |
              "$PY" toolkit/packaging/build_bundle.py build --version "$VERSION" --work "$RUNNER_TEMP/bundle" \
                 --require-licence | tee "$RUNNER_TEMP/build.log"
              archive=$(tail -n 1 "$RUNNER_TEMP/build.log")
              expected="capsule-studio-$VERSION-${{ matrix.platform }}.${{ matrix.archive }}"
              if [ "$(basename "$archive")" != "$expected" ] || [ ! -f "$archive" ]; then
                 echo "::error::expected $expected, got '$archive'"
                 exit 1
              fi
              echo "archive=$archive" >> "$GITHUB_OUTPUT"
         - name: Check universal binaries (macOS)
           if: runner.os == 'macOS'
           run: |
              app="$RUNNER_TEMP/bundle/out/capsule-studio-$VERSION-${{ matrix.platform }}/CapsuleStudio.app"
              # -print -quit, not "| head -n 1": under pipefail a second match could end find with SIGPIPE
              core=$(find "$app" -path '*QtCore.framework/Versions/*/QtCore' -type f -print -quit)
              for f in "$app/Contents/MacOS/studio" "$app/Contents/MacOS/capsule-studio" "$core"; do
                 archs=$(lipo -archs "$f")
                 echo "$f: $archs"
                 case " $archs " in *" arm64 "*) ;; *) echo "missing arm64"; exit 1 ;; esac
                 case " $archs " in *" x86_64 "*) ;; *) echo "missing x86_64"; exit 1 ;; esac
              done
         - name: Smoke test (unpacked download, offscreen)
           env:
              ARCHIVE: ${{ steps.build.outputs.archive }}
           run: '"$PY" -I toolkit/packaging/build_bundle.py smoke "$ARCHIVE" --work "$RUNNER_TEMP/smoke"'
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
           with:
              name: studio-${{ matrix.platform }}
              path: ${{ steps.build.outputs.archive }}
              if-no-files-found: error

   # Linux: built in the manylinux container (see the header), then checked against its glibc and C++ runtime.
   bundle-linux:
      name: studio bundle (linux-x86_64)
      continue-on-error: true
      timeout-minutes: 75
      runs-on: ubuntu-24.04
      container: quay.io/pypa/manylinux_2_34_x86_64:latest   # = env.LINUX_IMAGE (a job's container can't read env)
      defaults:
         run:
            shell: bash
      env:
         VERSION: ${{ inputs.version }}
         PLATFORM: linux-x86_64
      steps:
         # CPython's build needs: OpenSSL, libffi (ctypes), zlib, bzip2, xz, libuuid, SQLite (the GNU readline
         # module is not built: readline is never shipped). The bundle leaves the desktop stack to the user's
         # system, as the PySide6 wheels do; the smoke test (offscreen) still loads EGL / GL, fontconfig and a font,
         # xkbcommon, D-Bus and GLib, and PyInstaller reads the X11 / xcb libraries the Qt plugins link (but for
         # xcb-util-cursor, which only the xcb platform needs: the download's README asks the user's system for it).
         - name: Build and runtime libraries
           run: |
              dnf install -y --setopt=install_weak_deps=False \
                 openssl-devel libffi-devel zlib-devel bzip2-devel xz-devel libuuid-devel sqlite-devel \
                 mesa-libEGL mesa-libGL libxkbcommon libxkbcommon-x11 fontconfig dejavu-sans-fonts dbus-libs glib2 \
                 libX11 libX11-xcb libxcb libXext libXrender libXi libSM libICE xcb-util xcb-util-image \
                 xcb-util-keysyms xcb-util-renderutil xcb-util-wm
              echo "container: $LINUX_IMAGE"
              ldd --version | head -n 1
              gcc --version | head -n 1
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
           with:
              ref: ${{ inputs.umbrella_sha }}
              submodules: recursive
         # The pinned Python: CPython's release tag, checked against its commit, built with a shared libpython
         # (PyInstaller needs it; the image's own /opt/python interpreters are static) and an rpath to it.
         - name: Python (CPython ${{ env.CPYTHON_TAG }}, built here)
           run: |
              src="$RUNNER_TEMP/cpython"
              git clone --quiet --depth 1 --branch "$CPYTHON_TAG" "$CPYTHON_REPO" "$src"
              commit=$(git -C "$src" rev-parse HEAD)
              if [ "$commit" != "$CPYTHON_COMMIT" ]; then
                 echo "::error::$CPYTHON_TAG is $commit, expected $CPYTHON_COMMIT"
                 exit 1
              fi
              cd "$src"
              ./configure --quiet --prefix="$LINUX_PYTHON_PREFIX" --enable-shared --without-system-libmpdec \
                 --with-ensurepip=install LDFLAGS="-Wl,-rpath,$LINUX_PYTHON_PREFIX/lib"
              make --quiet -j"$(nproc)"
              make --quiet install
              base="$LINUX_PYTHON_PREFIX/bin/python3"
              built=$("$base" -c 'import platform; print(platform.python_version())')
              if [ "$built" != "$PYTHON_VERSION" ]; then
                 echo "::error::built Python $built, expected $PYTHON_VERSION"
                 exit 1
              fi
              "$base" -c 'import ctypes, bz2, lzma, ssl, sqlite3, uuid, zlib, sysconfig; print(sysconfig.get_config_var("LDLIBRARY"))'
              echo "BASE_PY=$base" >> "$GITHUB_ENV"
         - name: Build environment (pinned PySide6 and PyInstaller)
           run: |
              "$BASE_PY" -m venv "$RUNNER_TEMP/venv"
              py="$RUNNER_TEMP/venv/bin/python"
              echo "PY=$py" >> "$GITHUB_ENV"
              "$py" --version
              "$py" -m pip install --disable-pip-version-check --no-input --only-binary=:all: \
                 -r toolkit/toolkit/requirements/ui.txt
              "$py" -m pip install --disable-pip-version-check --no-input --prefer-binary \
                 -r toolkit/packaging/requirements-bundle.txt
              "$py" -m pip list
         - name: Build the bundle
           id: build
           run: |
              "$PY" toolkit/packaging/build_bundle.py build --version "$VERSION" --work "$RUNNER_TEMP/bundle" \
                 --require-licence | tee "$RUNNER_TEMP/build.log"
              archive=$(tail -n 1 "$RUNNER_TEMP/build.log")
              expected="capsule-studio-$VERSION-$PLATFORM.tar.gz"
              if [ "$(basename "$archive")" != "$expected" ] || [ ! -f "$archive" ]; then
                 echo "::error::expected $expected, got '$archive'"
                 exit 1
              fi
              echo "archive=$archive" >> "$GITHUB_OUTPUT"
         # Every ELF file of the download (Python, its extension modules, Qt, the plugins, PyInstaller's
         # bootloader): no glibc symbol newer than the container's, no libstdc++ / libgcc_s symbol version newer
         # than the container's own copies.
         - name: Check the glibc and C++ runtime baseline
           run: |
              "$BASE_PY" -I .github/scripts/check_elf_baseline.py \
                 "$RUNNER_TEMP/bundle/out/capsule-studio-$VERSION-$PLATFORM" --glibc-max "$LINUX_GLIBC_MAX" \
                 --base-lib /usr/lib64/libstdc++.so.6 --base-lib /usr/lib64/libgcc_s.so.1
         - name: Smoke test (unpacked download, offscreen)
           env:
              ARCHIVE: ${{ steps.build.outputs.archive }}
           run: '"$PY" -I toolkit/packaging/build_bundle.py smoke "$ARCHIVE" --work "$RUNNER_TEMP/smoke"'
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
           with:
              name: studio-${{ env.PLATFORM }}
              path: ${{ steps.build.outputs.archive }}
              if-no-files-found: error

   ready:
      needs: [bundle, bundle-linux]
      if: always()
      runs-on: ubuntu-24.04
      outputs:
         ready: ${{ steps.check.outputs.ready }}
      env:
         VERSION: ${{ inputs.version }}
      steps:
         - name: Uploaded bundles
           continue-on-error: true
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
           with:
              pattern: studio-*
              path: dist
              merge-multiple: true
         - name: All three present
           id: check
           run: |
              ready=true
              for f in linux-x86_64.tar.gz windows-x64.zip macos-universal2.zip; do
                 if [ -f "dist/capsule-studio-$VERSION-$f" ]; then
                    echo "found capsule-studio-$VERSION-$f"
                 else
                    echo "::warning::capsule-studio-$VERSION-$f was not built; the release leaves the bundles out"
                    ready=false
                 fi
              done
              echo "ready=$ready" >> "$GITHUB_OUTPUT"
